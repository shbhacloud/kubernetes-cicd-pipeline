apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-cicd-pipeline
  labels:
    app: kubernetes-cicd-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubernetes-cicd-pipeline
  template:
    metadata:
      labels:
        app: kubernetes-cicd-pipeline
    spec:
      containers:
        - name: kubernetes-cicd-pipeline
          image: ghcr.io/your-org/kubernetes-cicd-pipeline:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: FLASK_ENV
              value: "production"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

